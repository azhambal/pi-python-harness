name: Python checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install search backends
        run: sudo apt-get update && sudo apt-get install --yes ripgrep libicu-dev
      # The parity fixtures were produced with fd 10.5.0; apt ships an older fd.
      - name: Install fd 10.5.0
        run: |
          curl -fsSL -o fd.tar.gz https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-gnu.tar.gz
          echo "a1259cd129636efbc3fef123525c1b49e88fe5088c012630983c310e52fdfa95  fd.tar.gz" | sha256sum -c -
          tar -xzf fd.tar.gz
          sudo install fd-v10.5.0-x86_64-unknown-linux-gnu/fd /usr/local/bin/fd
      # Match the ICU/Unicode data in the reference Node 24.13.0 (ICU 77.1).
      - name: Install reference ICU 77.1
        run: |
          curl -fsSL -o icu77.tgz https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-Ubuntu22.04-x64.tgz
          echo "80383a0c1fdab88783d20851e7ec942236b6cca97b793b1edd156b73ef7a582d  icu77.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pi-icu"
          tar -xzf icu77.tgz -C "$RUNNER_TEMP/pi-icu"
          ICU_REFERENCE_LIB="$RUNNER_TEMP/pi-icu/icu/usr/local/lib"
          echo "PI_ICU_LIBRARY=$ICU_REFERENCE_LIB/libicui18n.so.77" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ICU_REFERENCE_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev,mcp-reference]'
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m ruff check src tests scripts
      - run: .venv/bin/python -m ruff format --check src tests scripts
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python scripts/generate_config_reference.py --check
      - run: .venv/bin/python -m pytest
